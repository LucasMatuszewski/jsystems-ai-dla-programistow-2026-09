name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit -- --maxWorkers=1
      - name: Start local production app
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/app-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/app-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/ && curl --fail --silent --output /dev/null http://127.0.0.1:3000/favicon.ico; then
              exit 0
            fi
            sleep 1
          done
          echo "Local production app did not become ready within 60 seconds."
          exit 1
      - name: Run integration tests
        run: npm run test:integration
      - name: Stop owned app process
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/app-server.pid" ]]; then
            server_pid=$(cat "$RUNNER_TEMP/app-server.pid")
            if [[ "$server_pid" =~ ^[0-9]+$ ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              for attempt in {1..10}; do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  exit 0
                fi
                sleep 1
              done
              kill -KILL "$server_pid" 2>/dev/null || true
            fi
          fi
